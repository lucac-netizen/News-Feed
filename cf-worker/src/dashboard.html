<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming News Ticker</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232733;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --new: #37d67a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    background: rgba(11,13,18,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    z-index: 10;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type="search"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    width: 200px;
  }
  select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  #status { font-size: 12px; color: var(--muted); }
  main { max-width: 860px; margin: 0 auto; padding: 12px 20px 60px; }
  .item {
    display: flex;
    gap: 12px;
    padding: 14px 12px;
    border-bottom: 1px solid var(--border);
    align-items: baseline;
  }
  .item.is-new { animation: flash 2.2s ease-out 1; }
  @keyframes flash {
    0% { background: rgba(55,214,122,0.16); }
    100% { background: transparent; }
  }
  .badge {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--bg);
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.reddit { background: #ff5722; }
  .item a {
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    line-height: 1.4;
  }
  .item a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; flex: 0 0 auto; margin-left: auto; padding-left: 12px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 40px 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Gaming News Ticker <span id="status">loading…</span></h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by keyword or source…">
    <select id="cat">
      <option value="">All sources</option>
      <option value="site">Publisher sites</option>
      <option value="reddit">Reddit</option>
    </select>
  </div>
</header>
<main id="list"></main>

<script>
const REFRESH_MS = 30000;
let lastIds = new Set();
let firstLoad = true;

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}

function render(items) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cat = document.getElementById('cat').value;
  const filtered = items.filter(it => {
    if (cat && it.category !== cat) return false;
    if (q && !(it.title.toLowerCase().includes(q) || it.source.toLowerCase().includes(q))) return false;
    return true;
  });

  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No items match.</div>';
    return;
  }

  list.innerHTML = filtered.map(it => {
    const isNew = !firstLoad && !lastIds.has(it.id);
    const badgeClass = it.category === 'reddit' ? 'badge reddit' : 'badge';
    return `<div class="item ${isNew ? 'is-new' : ''}">
      <span class="${badgeClass}">${it.source}</span>
      <a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
      <span class="meta">${timeAgo(it.published)}</span>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load() {
  try {
    const res = await fetch('feed.json?t=' + Date.now());
    const data = await res.json();
    const items = data.items || [];
    render(items);
    document.getElementById('status').textContent =
      'updated ' + timeAgo(data.generated_at) + ' · ' + items.length + ' items';
    lastIds = new Set(items.map(it => it.id));
    firstLoad = false;
  } catch (e) {
    document.getElementById('status').textContent = 'failed to load feed.json';
    console.error(e);
  }
}

document.getElementById('q').addEventListener('input', () => load());
document.getElementById('cat').addEventListener('change', () => load());
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>

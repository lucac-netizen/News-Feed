<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming News Ticker</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --border: #2a2a2a;
    --amber: #e8a33d;
    --amber-dim: #8a6428;
    --text: #d8d8d8;
    --muted: #6b6b6b;
    --hot: #3ecf5b;
    --warm: #9fcf3e;
    --mild: #e8a33d;
    --stale: #d64545;
    --new-flash: #1a2f1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Consolas", "SF Mono", "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
  }
  a { color: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .topbar .name { color: var(--amber); font-weight: 700; letter-spacing: 0.04em; font-size: 12px; }
  .topbar .name span { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .tabs { display: flex; gap: 14px; }
  .tab {
    appearance: none; background: none; border: none;
    color: var(--muted); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: 3px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--amber); border-bottom-color: var(--amber); }
  input[type="search"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 6px;
    font-size: 11px;
    width: 170px;
    font-family: inherit;
  }
  input[type="search"]::placeholder { color: var(--muted); }

  .statrow {
    display: flex;
    gap: 22px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .stat .k { color: var(--amber); font-size: 10px; letter-spacing: 0.03em; }
  .stat .v { color: var(--text); font-size: 12px; font-weight: 700; }
  .stat .v.up { color: var(--hot); }
  .stat .v.down { color: var(--stale); }

  main { padding: 0 0 40px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--amber-dim);
    padding: 5px 12px;
    font-weight: 700;
  }
  th.col-age { width: 70px; text-align: right; }
  th.col-source { width: 190px; }

  .group-row td {
    background: var(--panel);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--amber);
    padding: 4px 12px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  tbody tr.item-row { border-bottom: 1px solid var(--border); }
  tbody tr.item-row:hover { background: var(--panel); }
  tbody tr.item-row.is-new { animation: flash 2.4s ease-out 1; }
  @keyframes flash {
    0% { background: var(--new-flash); }
    100% { background: transparent; }
  }
  td { padding: 4px 12px; vertical-align: top; }

  .age-cell {
    font-weight: 700;
    font-size: 11px;
    text-align: right;
    white-space: nowrap;
  }
  .age-hot   { color: var(--hot); }
  .age-warm  { color: var(--warm); }
  .age-mild  { color: var(--mild); }
  .age-stale { color: var(--stale); }

  .source-cell { white-space: nowrap; font-size: 11px; color: var(--muted); }

  .headline-cell a { text-decoration: none; color: var(--text); font-size: 12px; }
  .headline-cell a:hover { color: var(--amber); text-decoration: underline; }

  .empty { color: var(--muted); padding: 40px 12px; text-align: center; font-size: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="name">GAMING NEWS TICKER <span id="clock"></span></div>
  <div class="tabs">
    <button class="tab active" data-cat="">ALL</button>
    <button class="tab" data-cat="site">SITES</button>
    <button class="tab" data-cat="reddit">REDDIT</button>
  </div>
  <input type="search" id="q" placeholder="filter...">
</div>
<div class="statrow">
  <div class="stat"><span class="k">SOURCES</span><span class="v" id="statSources">—</span></div>
  <div class="stat"><span class="k">ITEMS</span><span class="v" id="statItems">—</span></div>
  <div class="stat"><span class="k">NEW (5M)</span><span class="v up" id="statNew">—</span></div>
  <div class="stat"><span class="k">LAST POLL</span><span class="v" id="statPoll">—</span></div>
  <div class="stat"><span class="k">UPDATED</span><span class="v" id="statUpdated">—</span></div>
</div>
<main>
  <table>
    <thead>
      <tr>
        <th class="col-age">Age</th>
        <th class="col-source">Source</th>
        <th>Headline</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</main>

<script>
const REFRESH_MS = 30000;
let lastIds = new Set();
let firstLoad = true;
let activeCat = "";
let currentItems = [];

function ageMinutes(iso) {
  return (Date.now() - new Date(iso).getTime()) / 60000;
}

function timeAgo(iso) {
  const mins = Math.floor(ageMinutes(iso));
  if (mins < 1) return "now";
  if (mins < 60) return mins + "m";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h";
  return Math.floor(hrs / 24) + "d";
}

function ageClass(iso) {
  const m = ageMinutes(iso);
  if (m < 5) return "age-hot";
  if (m < 15) return "age-warm";
  if (m < 40) return "age-mild";
  return "age-stale";
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rowHtml(it) {
  const isNew = !firstLoad && !lastIds.has(it.id);
  return `<tr class="item-row ${isNew ? 'is-new' : ''}">
    <td class="age-cell ${ageClass(it.published)}">${timeAgo(it.published)}</td>
    <td class="source-cell">${escapeHtml(it.source)}</td>
    <td class="headline-cell"><a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a></td>
  </tr>`;
}

function groupRowHtml(label) {
  return `<tr class="group-row"><td colspan="3">${label}</td></tr>`;
}

function render(items) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const filtered = items.filter(it => {
    if (activeCat && it.category !== activeCat) return false;
    if (q && !(it.title.toLowerCase().includes(q) || it.source.toLowerCase().includes(q))) return false;
    return true;
  });

  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<tr><td colspan="3" class="empty">No items match.</td></tr>';
    return;
  }

  if (activeCat) {
    list.innerHTML = filtered.map(rowHtml).join('');
    return;
  }

  const sites = filtered.filter(it => it.category !== 'reddit');
  const reddit = filtered.filter(it => it.category === 'reddit');
  let html = '';
  if (sites.length) html += groupRowHtml('Publisher Sites') + sites.map(rowHtml).join('');
  if (reddit.length) html += groupRowHtml('Reddit') + reddit.map(rowHtml).join('');
  list.innerHTML = html;
}

async function load() {
  try {
    const res = await fetch('feed.json?t=' + Date.now());
    const data = await res.json();
    const items = data.items || [];
    currentItems = items;
    render(items);

    const newCount = firstLoad ? 0 : items.filter(it => !lastIds.has(it.id) && ageMinutes(it.published) <= 5).length;
    const sourceCount = new Set(items.map(it => it.source)).size;
    document.getElementById('statSources').textContent = sourceCount;
    document.getElementById('statItems').textContent = items.length;
    document.getElementById('statNew').textContent = newCount;
    document.getElementById('statPoll').textContent = data.poll_duration_ms ? (data.poll_duration_ms / 1000).toFixed(0) + 's' : '—';
    document.getElementById('statUpdated').textContent = data.generated_at ? timeAgo(data.generated_at) + ' ago' : '—';

    lastIds = new Set(items.map(it => it.id));
    firstLoad = false;
  } catch (e) {
    document.getElementById('statUpdated').textContent = 'error';
    console.error(e);
  }
}

function tick() {
  document.getElementById('clock').textContent = new Date().toUTCString().slice(17, 25) + ' UTC';
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render(currentItems);
  });
});
document.getElementById('q').addEventListener('input', () => render(currentItems));

tick();
setInterval(tick, 1000);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
